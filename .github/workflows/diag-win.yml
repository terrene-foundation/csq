name: DIAG windows doctest link (temporary, do not merge)
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
      - name: Env of interest
        shell: pwsh
        run: |
          Get-ChildItem env: | Where-Object { $_.Name -match 'VCRUNTIME|RUSTFLAGS|CARGO|TAURI|LIB$' } | Format-Table -AutoSize | Out-String -Width 400
      - name: (D) full test build first (what the failing job does)
        shell: pwsh
        continue-on-error: true
        run: cargo test --workspace --no-run --features csq/test-utils,csq-core/test-utils
      - name: (E) doctests after the full build, verbose (see rustdoc -L flags)
        shell: pwsh
        continue-on-error: true
        run: |
          cargo test --workspace --doc -v --features csq/test-utils,csq-core/test-utils -- redact_path 2>&1 | Select-String -Pattern "Running .*rustdoc.*csq_core|test result|FAILED|LNK|csq-[0-9a-f]+\\out" | ForEach-Object { $_.Line.Substring(0, [Math]::Min(3000, $_.Line.Length)) }
