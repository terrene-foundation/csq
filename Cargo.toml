[workspace]
resolver = "2"
members = [
  "csq-core",
  "csq",                      # Single-binary csq (issue #295).
  "csq-ledger",              # M10 Foundation-owned transparency-log server.
]

[workspace.package]
version = "2.16.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/terrene-foundation/csq"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `toml` parses + serializes TOML 1.0 documents. Added in PR-CA8 commit 2
# for codex `config.toml` per-spawn merge per spec 10 §10.4.6.1. Exact-
# minor-version pin per round-2 R2-H1: `toml::to_string` output is not
# byte-stable across major or minor versions; the property-test suite
# in `coc/translate/codex_merge.rs` MUST re-run against codex's TOML
# parser before bumping the minor. The intra-minor patch float (1.1.x)
# is OK — patches preserve serializer output by semver contract.
toml = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
# tracing-log is a default feature that silently installs a
# LogTracer via log::set_logger when `.try_init()` runs. The csq
# desktop surface registers tauri-plugin-log which ALSO installs a
# log facade — the second installation fails with SetLoggerError
# and panics the desktop app at startup. Disable tracing-log (and
# re-enable the other defaults we actually use) to keep the two
# systems separate.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "registry", "std", "ansi", "smallvec"] }
hex = "0.4"
sha2 = "0.10"
unicode-normalization = "0.1"
secrecy = { version = "0.10", features = ["serde"] }
libc = "0.2"
tempfile = "3"
urlencoding = "2"
# Date/time math for the Phase B' billing ledger (journal 0050). Used in
# usage::ledger::summarize for rolling time-window aggregation. `default-
# features = false` drops the platform-clock backend we don't need; we
# pass our own `now` into summarize so deterministic tests work without
# touching the real clock.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# UUID v4 for identity-keyed account storage (issue #292 / A++ Phase 1).
# `v4` is the only variant used (random UUIDs); `serde` enables round-trip
# through identity store JSON files. First new runtime dep added since
# v2.0.0; approval recorded in journal 0004 of the
# account-slot-decoupling workspace per rules/independence.md Rule 3.
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "blocking"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
getrandom = "0.2"
security-framework = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
# Gemini PR-G2a — encryption-at-rest primitives for the platform::secret
# fallback path (Linux without Secret Service / explicit opt-in). RustCrypto
# audited pure Rust; no FFI. argon2 is OWASP 2023 KDF; aes-gcm is the AEAD.
# zeroize wipes secret material before drop.
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
# `subtle` provides constant-time equality (`ConstantTimeEq`) for
# comparing OAuth state tokens. Already a transitive dep of
# `ed25519-dalek` / `aes-gcm`, so adding it as a direct workspace dep
# does not pull anything new into the build graph — only gives us the
# public API surface. Kept at workspace level so both `csq-core` (state
# store + race) and `csq` (race state-token compare in the desktop
# surface) share the same version.
subtle = { version = "2", default-features = false }
# Gemini PR-G2a.2 — Linux Secret Service / kwallet via D-Bus. The crate's
# `rt-tokio-crypto-rust` feature picks tokio for the async runtime and
# RustCrypto for session-key crypto so we keep the no-OpenSSL-FFI posture.
# Linux-only — the crate itself does not compile on macOS / Windows.
secret-service = { version = "4", default-features = false, features = ["rt-tokio-crypto-rust"] }
# PR-CA9b T18 originally used bincode 1.3.3 for the parse-cache wire format,
# but bincode 1.x AND 2.x are both flagged unmaintained (RUSTSEC-2024-0419,
# RUSTSEC-2025-0141). The use case is trivial — length-prefix + bytes for a
# single Vec<u8> — so the dependency is dropped entirely. The on-disk format
# (`u64 LE length || bytes`) is bit-identical to bincode 1.x's
# `with_fixint_encoding`, so existing 0x0001 caches keep working.
# `regex` is used by `audit::persist` to validate RULE_ID strings against
# `^[A-Z][A-Z0-9-]{1,32}$` (B6 mitigation, spec 12 §12.5). Already a
# transitive dep via `tracing-subscriber` / `tower`; promoting to a direct
# workspace dep gives a stable API surface and version pin in one place.
regex = "1"
# `async-trait` enables async methods on traits with object-safe vtables.
# M01 (workspace `csq-pact-eatp-adoption`) introduces `audit::LedgerSink`
# whose `append` / `verify_at` methods are async and reachable through
# `dyn LedgerSink` from the daemon. Until rustc stabilises async fn in
# trait objects (rust-lang/rust#91611), the macro is the standard path.
async-trait = "0.1"
# `keyring` provides a single cross-platform API for OS keychain storage:
# macOS Keychain, Linux Secret Service (D-Bus), Windows Credential Manager.
# M04 (csq-pact-eatp-adoption) uses it for signing-key custody under the
# `csq-audit-signing` service name. The per-platform-fidelity argument for
# native crates doesn't apply to signing-key storage (simpler than OAuth
# tokens); `keyring` ships one API across 3 platforms in one milestone.
# PRIMARY METHODOLOGICAL DIRECTIVE M04: `security-framework` (macOS),
# `secret-service` (Linux), and `windows-rs` (Windows) are BLOCKED for
# signing-key custody — all keychain access goes through `keyring`.
# Platform features enable real OS keychain backends:
#   apple-native   — macOS Keychain via security-framework (keyring-internal dep)
#   windows-native — Windows Credential Manager
# Without these features, keyring falls back to an in-memory mock that does
# not persist between calls; tests and production storage would both fail silently.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# `jsonschema` validates JSON values against a JSON Schema document.
# Used by the Phase-2b governance enforcement loop (T1a.3) to validate
# provider responses against the response_format JSON Schema constraint.
# Optional — compiled only in enterprise builds (csq-core `enterprise` feature).
# Pure-Rust; no C FFI added to the build graph.
jsonschema = { version = "0.46", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = "allow"
