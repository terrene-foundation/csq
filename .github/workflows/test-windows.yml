name: CI (Windows)

# Windows is the one leg the esperie self-hosted fleet cannot serve (no Windows
# runner; the fleet is Linux + macOS-ARM). It stays on github-hosted
# `windows-latest`, but PATH-GATED to Rust-affecting changes only — so the
# per-push Windows minutes (billed at GitHub's 2x Windows rate) are spent only
# when they can actually catch a Windows regression, not on doc/CI-only PRs.
# macOS + Linux test legs run free on the fleet via `test.yml`.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: 1.94.1
  CACHE_VERSION: v2

jobs:
  rust-test-windows:
    name: Rust tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ env.RUST_VERSION }}-

      - name: Run tests
        # `shell: bash` selects Git Bash on windows-latest (which injects
        # `set -eo pipefail`), so the first failing `cargo test` propagates as
        # the step exit code instead of being masked. Matches test.yml's
        # rationale. --test-threads=2 avoids cli_deps probe-timeout flakes
        # under CPU saturation.
        shell: bash
        run: |
          cargo test --workspace --lib --bins --features csq/test-utils,csq-core/test-utils
          cargo test --workspace --test '*' --features csq/test-utils,csq-core/test-utils -- --test-threads=2
        timeout-minutes: 25
