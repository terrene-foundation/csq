name: daemon-twin parity

# Enforces that the CLI daemon (`csq daemon start`) and the desktop in-process
# daemon supervise the IDENTICAL set of subsystems. The two are mutually
# exclusive at runtime (one PidFile, one socket), so a subsystem wired into only
# one twin simply never runs for the other launch mode — a silent capability
# loss with no error and no failing test.
#
# Why it exists: a cache-sweeper subsystem was once wired into the CLI daemon and
# not the desktop twin, so desktop-only users ran for months with that subsystem
# simply absent — no error, no failing test, nothing to notice. Review caught the
# asymmetry but could not call it a defect, because nothing mechanical said which
# of the two lists was the correct one. This gate says.
#
# NOTE: this file ships to the public community repo. Keep it to the technical
# contract; internal provenance (journal numbers, PR numbers, review history,
# commit SHAs) does not belong here — the community tree has no `.claude/` or
# `workspaces/` for such references to resolve against, and the extraction's
# leak gate does not match free-form narrative.
#
# Pure Python gate (no toolchain, no build, no secrets) — runs on every PR that
# touches either twin or the gate itself.

on:
  push:
    branches: [main]
    paths:
      - "csq/src/cli/commands/daemon.rs"
      - "csq/src/desktop/daemon_supervisor.rs"
      - "scripts/check-daemon-twin-parity.py"
      - ".github/workflows/daemon-twin-parity.yml"
  pull_request:
    branches: [main]
    paths:
      - "csq/src/cli/commands/daemon.rs"
      - "csq/src/desktop/daemon_supervisor.rs"
      - "scripts/check-daemon-twin-parity.py"
      - ".github/workflows/daemon-twin-parity.yml"

# Cancel a superseded run on the same ref — concurrency hygiene: a superseded run on the same ref is
# wasted work. `main` is
# excluded: a push to main must produce a verdict for every commit.
concurrency:
  group: daemon-twin-parity-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  daemon-twin-parity:
    # Runtime cap (2026-10-20): single static Python check + setup; recent3 runs0.22-0.28m, over4m margin.
    # Recent-run samples/margins: scripts/ci/ci-gate-runtime-budgets.json.
    timeout-minutes: 5
    name: daemon twins supervise the same subsystems
    runs-on: ubuntu-latest
    steps:
      # delete the persistent runner's previous clone so this job's
      # checkout is a fresh clone; see scripts/verify/runner-workspace-hygiene.sh.
      - name: Start from an empty workspace
        if: runner.environment != 'github-hosted'
        shell: bash
        working-directory: .
        run: |
          ws=$(cd "$GITHUB_WORKSPACE" && pwd -P) && rw=$(cd "$RUNNER_WORKSPACE" && pwd -P) && [ ! -L "${GITHUB_WORKSPACE%/}" ] && [[ "$ws" == "$rw"/* ]] || { echo "::error::GITHUB_WORKSPACE ($GITHUB_WORKSPACE) is a symlink or does not resolve under RUNNER_WORKSPACE ($RUNNER_WORKSPACE)"; exit 1; }
          cd "$GITHUB_WORKSPACE" && shopt -s dotglob nullglob && rm -rf -- ./*
          gv=$(git version) && IFS=' .' read -r _ _ gmaj gmin _ <<<"$gv" && (( gmaj > 2 || (gmaj == 2 && gmin >= 32) )) || { echo "::error::${gv:-git} is older than 2.32, which ignores GIT_CONFIG_GLOBAL"; exit 1; }
          for v in GIT_TEMPLATE_DIR GIT_SSH_COMMAND GIT_PROXY_COMMAND GIT_ASKPASS GIT_EXEC_PATH GIT_ALTERNATE_OBJECT_DIRECTORIES; do [ -z "${!v:-}" ] || { echo "::error::$v is set in this job's environment and can run code or swap objects during checkout"; exit 1; }; done
          cfg=$(cd / && unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR && git config --list --show-scope)
          bad=$(printf '%s\n' "$cfg" | awk -F'\t' '$1 != "local" && $1 != "worktree" { e = index($2, "="); v = e ? substr($2, e + 1) : "\001"; n = tolower(e ? substr($2, 1, e - 1) : $2); r = 0; if (n ~ /^(core\.(hookspath|fsmonitor|sshcommand|gitproxy|askpass)|init\.templatedir|uploadpack\.packobjectshook|remote\..*\.(uploadpack|receivepack)|include\..*|includeif\..*)$/) r = 1; else if (n == "protocol.ext.allow") r = (v != "never"); else if (n ~ /^filter\./) r = !(n == "filter.lfs.required" || (n ~ /^filter\.lfs\.(clean|smudge|process)$/ && v ~ /^git-lfs /)); else if (n ~ /^credential\.(.*\.)?helper$/) r = !(v ~ /^(osxkeychain|cache|store|manager|manager-core|git-credential-manager)?$/ || v ~ /^\/.*\/git-credential-manager$/ || v ~ /^!\/(opt\/homebrew|usr\/local|usr)\/bin\/gh auth git-credential$/ || v ~ /^cache --timeout=[0-9]+$/); if (r) print $1 " " n }')
          [ -z "$bad" ] || { echo "::error::git config from outside the clone (global, system or GIT_CONFIG_* in the environment) sets keys that can run code during checkout:"; printf '%s\n' "$bad"; exit 1; }

      - uses: actions/checkout@v5
      - name: Gate — CLI and desktop daemon twins have identical subsystem sets
        run: python3 scripts/check-daemon-twin-parity.py
