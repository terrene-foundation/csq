name: Release

# Triggered by pushing a tag that looks like v*, e.g. v2.0.0-alpha.3.
# Builds CLI and desktop artifacts for all 3 platforms in parallel,
# then uploads them to the matching GitHub Release.
#
# All release artifacts (CLI + desktop) receive Foundation Ed25519
# .sig files. macOS Gatekeeper and Windows SmartScreen still warn on
# first launch of the desktop bundles — those require an Apple
# Developer ID / Microsoft signing cert, which are separate from our
# Ed25519 signatures.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: 1.94.1
  CACHE_VERSION: v1

jobs:
  # ── Version lockstep gate ──────────────────────────────────
  # Belt-and-suspenders mirror of `version-lockstep.yml`. The PR-time
  # workflow only fires when Cargo.toml / tauri.conf.json change, so a
  # release-tag push that does NOT touch either file (e.g. tagging an
  # older commit) would skip the check. Running it here gates the
  # entire release matrix on the same invariant: tauri.conf.json must
  # match Cargo.toml workspace.package.version. Origin: issue #383.
  version-check:
    name: Version lockstep (tauri.conf.json == Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        run: |
          set -euo pipefail
          CARGO_VER=$(awk '/^\[workspace.package\]/{f=1;next} f && /^version[[:space:]]*=/{print; exit}' Cargo.toml \
            | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          TAURI_VER=$(jq -r '.version' csq/tauri.conf.json)
          echo "Cargo.toml workspace.package.version : ${CARGO_VER}"
          echo "csq/tauri.conf.json::version         : ${TAURI_VER}"
          if [ "${CARGO_VER}" != "${TAURI_VER}" ]; then
            echo "error_kind: version_drift" >&2
            echo "::error::Cargo.toml (${CARGO_VER}) and csq/tauri.conf.json (${TAURI_VER}) must match. Bump csq/tauri.conf.json::version to ${CARGO_VER} before tagging." >&2
            exit 1
          fi
          # Also verify the pushed tag (refs/tags/vX.Y.Z) matches.
          TAG_REF="${GITHUB_REF#refs/tags/v}"
          if [ "${GITHUB_REF}" != "${TAG_REF}" ] && [ "${TAG_REF}" != "${CARGO_VER}" ]; then
            echo "::error::Tag (${TAG_REF}) does not match Cargo.toml version (${CARGO_VER})." >&2
            exit 1
          fi
          echo "PASS: versions match (${CARGO_VER})"

  # ── Tag classifier (stable vs prerelease) ──────────────────
  # Stable tags (vX.Y.Z, no suffix) skip the macOS branch of the
  # build-desktop matrix; the maintainer pre-uploads Developer-ID
  # signed + notarized DMG + .app.tar.gz + .sig to the draft release
  # per docs/release-signing.md. The publish job validates their
  # presence and fails closed if missing. Prerelease tags
  # (vX.Y.Z-rc.N, -alpha, -beta) continue to use the ad-hoc-codesign
  # fallback at lines ~225-275 below.
  tag-classify:
    name: Classify tag (stable vs prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      is_stable: ${{ steps.classify.outputs.is_stable }}
    steps:
      - name: Determine tag class
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          # Stable: vX.Y.Z exactly. Prerelease: anything with a `-` suffix
          # (rc, alpha, beta). Non-vX patterns are caught by the
          # `on.push.tags: ["v*"]` filter so they never reach this job.
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "Stable tag detected: $GITHUB_REF"
            echo "  → macOS desktop bundle is maintainer-signed (build-desktop will skip macOS)"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "Prerelease tag detected: $GITHUB_REF"
            echo "  → macOS desktop bundle uses CI ad-hoc-codesign fallback"
          fi

  # ── CLI binaries (all 3 platforms) ─────────────────────────
  build-cli:
    name: CLI (${{ matrix.target }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: csq-linux-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: csq-macos-aarch64
            ext: ""
          # Cross-compile x86_64 from Apple Silicon — macos-13 (Intel)
          # runners are scarce and consistently fail to allocate.
          # macos-latest (arm64) ships with Xcode that supports both
          # arches, so `cargo build --target x86_64-apple-darwin` just
          # works after `rustup target add` (handled by the toolchain
          # action's `targets:` input).
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: csq-macos-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: csq-windows-x86_64.exe
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ env.CACHE_VERSION }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI
        run: cargo build --release -p csq --features cli --no-default-features --target ${{ matrix.target }}
        timeout-minutes: 30

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/csq${{ matrix.ext }}" "dist/${{ matrix.artifact }}"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            certutil -hashfile "${{ matrix.artifact }}" SHA256 | grep -v ":" | tr -d ' \r' > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" | awk '{print $1}' > "${{ matrix.artifact }}.sha256"
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # ── Desktop artifacts (Tauri bundler, all 3 platforms) ────
  # On stable tags the macOS matrix cell is skipped — the maintainer
  # uploads a Developer-ID signed + notarized DMG (and the matching
  # auto-updater .app.tar.gz + minisign .sig) to the draft release
  # before pushing the tag. Linux + Windows always build in CI. See
  # docs/release-signing.md § Step 8 and the publish job's "Validate
  # maintainer macOS artifacts" step below.
  build-desktop:
    name: Desktop (${{ matrix.os }})
    needs: [version-check, tag-classify]
    runs-on: ${{ matrix.os }}
    # Per-step `if:` gates the macOS cell on stable tags below — GH
    # Actions does NOT expose `matrix` to job-level `if:`, so the skip
    # must be applied step-by-step. Steps below set `if: matrix.platform
    # != 'macos' || needs.tag-classify.outputs.is_stable != 'true'`.
    # The macOS runner still boots on stable tags but every step is
    # skipped (~30s overhead per release — acceptable vs duplicating the
    # whole steps block into a separate single-platform job).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      # Single skip predicate — referenced by every subsequent step's
      # `if:` clause. On the macOS cell + stable tag, every step short-
      # circuits (~30s runner overhead) and the job completes as
      # "success" with the macOS cell empty. The maintainer pre-uploads
      # macOS artifacts per docs/release-signing.md § Step 8; the
      # publish job validates their presence.
      - name: Compute skip predicate
        id: skip
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          IS_STABLE: ${{ needs.tag-classify.outputs.is_stable }}
        run: |
          # Use env-var passthrough rather than direct expression
          # interpolation inside the shell — defends against future
          # matrix entries with shell-active characters being injected
          # into the test expression.
          if [[ "$PLATFORM" == "macos" && "$IS_STABLE" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "macOS cell on stable tag — skipping build; maintainer artifacts expected on draft release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.skip.outputs.skip != 'true'

      - name: Install Rust toolchain
        if: steps.skip.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          # On macOS we build a universal-apple-darwin bundle (fat
          # Mach-O with both arm64 + x86_64 slices) so Intel Mac users
          # can auto-update from the same artifact arm64 users get.
          # Both targets must be rustup-installed; otherwise
          # `cargo tauri build --target universal-apple-darwin` will
          # silent-fallback to host-arch-only output. See workspace
          # `intel-desktop-auto-update/journal/0001` (deep-analyst F3).
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        if: steps.skip.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ env.CACHE_VERSION }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux system deps (Tauri)
        if: steps.skip.outputs.skip != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup Node.js
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            csq/ui/package-lock.json
            csq/package-lock.json

      - name: Install frontend npm deps
        if: steps.skip.outputs.skip != 'true'
        working-directory: csq/ui
        run: npm ci

      - name: Install Tauri CLI host npm deps
        if: steps.skip.outputs.skip != 'true'
        working-directory: csq
        run: npm ci

      - name: Build desktop
        if: steps.skip.outputs.skip != 'true'
        working-directory: csq
        # `shell: bash` is REQUIRED: the run block below uses bash `[[ ]]`
        # test syntax, but windows-latest defaults to PowerShell which
        # cannot parse it (`Missing '(' after 'if'`). ubuntu defaults to
        # bash and macOS skips on stable tags, so the gap only fires on
        # the Windows desktop cell. (Regression from the universal-binary
        # conditional added for Intel auto-update; first surfaced v2.14.0.)
        shell: bash
        # TAURI_SIGNING_* env vars trigger `createUpdaterArtifacts:
        # true` in tauri.conf.json to emit `.app.tar.gz`,
        # `.AppImage.tar.gz`, and `-setup.nsis.zip` bundles alongside
        # the regular installers, each paired with a minisign `.sig`
        # file the updater plugin verifies on install.
        #
        # On macOS we pass `--target universal-apple-darwin` so the
        # produced `.app` carries a fat Mach-O with both arm64 and
        # x86_64 slices. One signed artifact serves both arches in
        # `latest.json` (darwin-aarch64 + darwin-x86_64 keys point at
        # the same URL), preserving the Gatekeeper "same Team ID
        # across updates" rule. See workspace
        # `intel-desktop-auto-update/journal/0001`.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npx @tauri-apps/cli build --target universal-apple-darwin
          else
            npx @tauri-apps/cli build
          fi
        timeout-minutes: 45

      - name: Ad-hoc re-sign macOS .app bundle
        if: steps.skip.outputs.skip != 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          # Tauri's bundler leaves the .app with a Mach-O linker
          # signature on the inner binary but NO Contents/_CodeSignature/
          # CodeResources seal on the bundle itself. Gatekeeper reads
          # this as "code has no resources but signature indicates
          # they must be present" and shows the user a misleading
          # "app is damaged" error.
          #
          # Re-sign with `codesign --force --deep --sign -` (ad-hoc)
          # to regenerate CodeResources. This is not a trusted
          # signature (no Apple Developer ID), so users on first
          # launch will still need to right-click → Open once —
          # but they'll see "developer cannot be verified" with a
          # working bypass instead of "damaged" with no bypass.
          # Universal-binary build lands under
          # target/universal-apple-darwin/release/bundle/macos/.
          # Single-arch builds land under target/<triple>/release/bundle/macos/
          # (e.g., target/aarch64-apple-darwin/...). Host-default
          # builds land under target/release/bundle/macos/.
          # Probe each candidate path's existence before find
          # (per redteam R1 F2: bare `2>/dev/null` silences real errors
          # like permission denied + broken symlinks). Expanded path
          # set per redteam R2 F8 to catch any *-apple-darwin triple
          # output Tauri may emit.
          SEARCH_PATHS=()
          for p in target/universal-apple-darwin/release/bundle/macos \
                   target/aarch64-apple-darwin/release/bundle/macos \
                   target/x86_64-apple-darwin/release/bundle/macos \
                   target/release/bundle/macos; do
            [ -d "$p" ] && SEARCH_PATHS+=("$p")
          done
          if [ ${#SEARCH_PATHS[@]} -eq 0 ]; then
            echo "::error::no macOS bundle dir found under any of:"
            echo "::error::  target/universal-apple-darwin/release/bundle/macos"
            echo "::error::  target/aarch64-apple-darwin/release/bundle/macos"
            echo "::error::  target/x86_64-apple-darwin/release/bundle/macos"
            echo "::error::  target/release/bundle/macos"
            echo "::error::Build may have failed or output to an unexpected path."
            exit 1
          fi
          APP_BUNDLE=$(find "${SEARCH_PATHS[@]}" -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::no .app bundle found under target/*/bundle/macos/"
            exit 1
          fi

          # Universal-binary gate: the main Mach-O must contain both
          # arm64 and x86_64 slices. If `--target universal-apple-darwin`
          # silently fell back to host-arch-only output (e.g. because a
          # rustup target wasn't installed), this gate catches it before
          # an arm64-only bundle ships to Intel users as if it were
          # universal. See workspace
          # `intel-desktop-auto-update/journal/0001` (deep-analyst F3,
          # tauri-platform F1).
          MAIN_BINARY=$(find "$APP_BUNDLE/Contents/MacOS" -maxdepth 1 -type f | head -1)
          if [ -z "$MAIN_BINARY" ]; then
            echo "::error::no main binary found under $APP_BUNDLE/Contents/MacOS/"
            exit 1
          fi
          echo "Inspecting main binary: $MAIN_BINARY"
          LIPO_OUT=$(lipo -info "$MAIN_BINARY")
          echo "$LIPO_OUT"
          if ! echo "$LIPO_OUT" | grep -q 'x86_64' || ! echo "$LIPO_OUT" | grep -q 'arm64'; then
            echo "::error::main binary is NOT a universal fat Mach-O — missing x86_64 or arm64 slice."
            echo "::error::Intel Mac users would see 'Bad CPU type in executable' on launch."
            echo "::error::Check that both rustup targets (aarch64-apple-darwin, x86_64-apple-darwin) are installed."
            exit 1
          fi
          echo "Universal binary gate OK: both x86_64 and arm64 slices present."

          echo "Re-signing: $APP_BUNDLE"
          codesign --force --deep --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict "$APP_BUNDLE"
          echo "Signature verified."

          # Rebuild the DMG around the re-signed app so the DMG's
          # inner .app has the coherent signature. Tauri's DMG step
          # already ran (producing an unsigned DMG); we need to
          # re-create it with hdiutil around the now-signed .app.
          # Universal-binary DMG lands under
          # target/universal-apple-darwin/release/bundle/dmg/.
          # Single-arch DMGs land under target/<triple>/release/bundle/dmg/.
          # Probe each candidate path before find (redteam R1 F2 +
          # R2 F8 — expanded path set).
          DMG_SEARCH=()
          for p in target/universal-apple-darwin/release/bundle/dmg \
                   target/aarch64-apple-darwin/release/bundle/dmg \
                   target/x86_64-apple-darwin/release/bundle/dmg \
                   target/release/bundle/dmg; do
            [ -d "$p" ] && DMG_SEARCH+=("$p")
          done
          if [ ${#DMG_SEARCH[@]} -eq 0 ]; then
            DMG_PATH=""
          else
            DMG_PATH=$(find "${DMG_SEARCH[@]}" -maxdepth 2 -name "*.dmg" -type f | head -1)
          fi
          if [ -n "$DMG_PATH" ]; then
            echo "Rebuilding DMG: $DMG_PATH"
            TMP_DMG_DIR=$(mktemp -d)
            cp -R "$APP_BUNDLE" "$TMP_DMG_DIR/"
            # Add a symlink to /Applications so the drag-install UX
            # works the same as the Tauri-built DMG.
            ln -s /Applications "$TMP_DMG_DIR/Applications"
            rm "$DMG_PATH"
            hdiutil create \
              -volname "Code Session Quota" \
              -srcfolder "$TMP_DMG_DIR" \
              -ov \
              -format UDZO \
              "$DMG_PATH"
            rm -rf "$TMP_DMG_DIR"
            echo "DMG rebuilt at $DMG_PATH"
          fi

      - name: Collect desktop artifacts
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p dist-desktop
          # Tauri 2.x signs installers directly for Linux and Windows
          # (no .tar.gz / .nsis.zip wrapper); macOS still needs the
          # .app.tar.gz wrapper because the .app bundle is a directory.
          # Grab the installer plus its Tauri-emitted `.sig`.
          if [ "$RUNNER_OS" = "Linux" ]; then
            find target/release/bundle -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} dist-desktop/ \;
            find target/release/bundle -type f \( -name "*.deb.sig" -o -name "*.rpm.sig" -o -name "*.AppImage.sig" \) -exec cp {} dist-desktop/ \;
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # Universal-binary build outputs to
            # target/universal-apple-darwin/release/bundle/; single-arch
            # builds output to target/<triple>/release/bundle/. Probe
            # every candidate (redteam R1 F2 + R2 F8 — expanded set).
            MACOS_BUNDLE_PATHS=()
            for p in target/universal-apple-darwin/release/bundle \
                     target/aarch64-apple-darwin/release/bundle \
                     target/x86_64-apple-darwin/release/bundle \
                     target/release/bundle; do
              [ -d "$p" ] && MACOS_BUNDLE_PATHS+=("$p")
            done
            if [ ${#MACOS_BUNDLE_PATHS[@]} -gt 0 ]; then
              find "${MACOS_BUNDLE_PATHS[@]}" -type f -name "*.dmg" -exec cp {} dist-desktop/ \;
              find "${MACOS_BUNDLE_PATHS[@]}" -type f \( -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) -exec cp {} dist-desktop/ \;
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            find target/release/bundle -type f \( -name "*.msi" -o -name "*-setup.exe" \) -exec cp {} dist-desktop/ \;
            find target/release/bundle -type f \( -name "*.msi.sig" -o -name "*-setup.exe.sig" \) -exec cp {} dist-desktop/ \;
          fi
          # Rename to csq-desktop-<platform>.<ext>. Tauri sigs are
          # preserved alongside their installer (e.g. `.AppImage` +
          # `.AppImage.sig`, `-setup.exe` + `-setup.exe.sig`) so the
          # publish job can read them into `latest.json`.
          cd dist-desktop
          for f in *; do
            case "$f" in
              # macOS updater bundle (directory → tar.gz wrapper).
              *.app.tar.gz)          mv "$f" "csq-desktop-${{ matrix.platform }}.app.tar.gz" ;;
              *.app.tar.gz.sig)      mv "$f" "csq-desktop-${{ matrix.platform }}.app.tar.gz.sig" ;;
              # Windows NSIS installer (direct .exe, the updater path).
              *-setup.exe)           mv "$f" "csq-desktop-${{ matrix.platform }}-setup.exe" ;;
              *-setup.exe.sig)       mv "$f" "csq-desktop-${{ matrix.platform }}-setup.exe.sig" ;;
              # Tauri-signed installers (their .sig pairs go alongside).
              *.AppImage.sig)        mv "$f" "csq-desktop-${{ matrix.platform }}.AppImage.sig" ;;
              *.deb.sig)             mv "$f" "csq-desktop-${{ matrix.platform }}.deb.sig" ;;
              *.rpm.sig)             mv "$f" "csq-desktop-${{ matrix.platform }}.rpm.sig" ;;
              *.msi.sig)             mv "$f" "csq-desktop-${{ matrix.platform }}.msi.sig" ;;
            esac
          done
          # Then rename the installers themselves. Skip anything the
          # first pass already renamed so a file like `-setup.exe`
          # (already moved) isn't re-matched by the generic `.exe`
          # arm and clobbered.
          for f in *; do
            case "$f" in
              csq-desktop-*) continue ;;
              *.deb)       mv "$f" "csq-desktop-${{ matrix.platform }}.deb" ;;
              *.rpm)       mv "$f" "csq-desktop-${{ matrix.platform }}.rpm" ;;
              *.AppImage)  mv "$f" "csq-desktop-${{ matrix.platform }}.AppImage" ;;
              *.dmg)       mv "$f" "csq-desktop-${{ matrix.platform }}.dmg" ;;
              *.msi)       mv "$f" "csq-desktop-${{ matrix.platform }}.msi" ;;
            esac
          done
          # Compute SHA256 for installers only — `.sig` files from
          # the Tauri signer are themselves text and should not be
          # hashed for the SHA256SUMS file.
          for f in csq-desktop-*; do
            case "$f" in
              *.sig) continue ;;
            esac
            if [ -f "$f" ]; then
              if [ "$RUNNER_OS" = "Windows" ]; then
                certutil -hashfile "$f" SHA256 | grep -v ":" | tr -d ' \r' > "$f.sha256"
              else
                shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
              fi
            fi
          done
          ls -la

      - name: Upload desktop artifacts
        if: steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-desktop/*
          if-no-files-found: error

  # ── Publish to GitHub Release ─────────────────────────────
  release:
    name: Publish release
    # `tag-classify` is listed here (in addition to being a transitive
    # dep via build-desktop) because `needs.tag-classify.outputs.*` is
    # only available when tag-classify is a DIRECT dependency. Removing
    # this entry would break the "Validate maintainer macOS artifacts"
    # and "Prune ..." steps below that read `is_stable`.
    needs: [build-cli, build-desktop, tag-classify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-latest-cargo-signer-${{ env.CACHE_VERSION }}-${{ env.RUST_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build sign-release helper
        run: cargo build --release --bin sign-release -p csq-core
        timeout-minutes: 15

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Validate maintainer macOS artifacts (stable tags only)
        if: needs.tag-classify.outputs.is_stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # On stable tags the build-desktop matrix skipped macOS; the
          # maintainer was expected to pre-upload three artifacts to the
          # draft release per docs/release-signing.md § Step 8. Fail closed
          # if any are missing — better than publishing a broken updater
          # manifest or a release that's missing the macOS DMG.
          required=(
            csq-desktop-macos.dmg
            csq-desktop-macos.app.tar.gz
            csq-desktop-macos.app.tar.gz.sig
          )

          # Capture stderr so an auth / network / API failure surfaces
          # with the real error rather than the generic "no draft release"
          # message — the diagnostic distinction matters at 03:00 UTC.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets >assets.json 2>view-err.txt; then
            echo "::error::Failed to read draft release $TAG. gh stderr:"
            sed 's/^/::error::  /' view-err.txt
            echo "::error::If the message is 'release not found', create the draft release and upload"
            echo "::error::the three macOS artifacts BEFORE pushing the tag (docs/release-signing.md § Step 8):"
            for f in "${required[@]}"; do echo "::error::  - $f"; done
            exit 1
          fi

          missing=()
          for f in "${required[@]}"; do
            if ! jq -e --arg n "$f" '.assets[] | select(.name == $n)' assets.json >/dev/null; then
              missing+=("$f")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Draft release $TAG is missing maintainer-signed macOS artifacts:"
            for f in "${missing[@]}"; do echo "::error::  - $f"; done
            echo "::error::See docs/release-signing.md § Step 8 — upload them and re-run this workflow."
            exit 1
          fi

          echo "All maintainer macOS artifacts present on $TAG:"
          for f in "${required[@]}"; do echo "  ✓ $f"; done

          # Download into the staging tree so the existing flatten step picks
          # them up alongside the workflow-built Linux + Windows artifacts.
          # Use a fresh subdir so the flatten step's `find` discovers them.
          mkdir -p staging/desktop-macos-maintainer
          ( cd staging/desktop-macos-maintainer && \
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'csq-desktop-macos.dmg' \
              --pattern 'csq-desktop-macos.app.tar.gz' \
              --pattern 'csq-desktop-macos.app.tar.gz.sig' )

          # Compute the .sha256 sidecars so the "Stage flattened assets"
          # step rolls them into SHA256SUMS. The matrix-built artifacts
          # already have their sidecars from build-desktop's "Collect
          # desktop artifacts" step; this mirrors that contract for the
          # maintainer-uploaded files.
          cd staging/desktop-macos-maintainer

          # AppleDouble guard — fail closed on the v2.7.8 updater-unpack
          # root cause (journal 0048). macOS BSD `tar` embeds `._<name>`
          # AppleDouble companion entries for the staple/quarantine xattrs
          # unless COPYFILE_DISABLE=1 was set when the tarball was built.
          # tauri-plugin-updater unpacks with the Rust `tar` crate, which
          # fails on the top-level `._Code Squad Q.app` entry — breaking
          # auto-update for EVERY macOS user. The runbook (§ 7a) now sets
          # COPYFILE_DISABLE=1, but this CI gate is the structural backstop:
          # a maintainer who forgets the env var cannot publish a tarball
          # that bricks the update path.
          adouble=$(tar tzf csq-desktop-macos.app.tar.gz | grep -c '/\._\|^\._' || true)
          if [ "$adouble" -ne 0 ]; then
            echo "::error::csq-desktop-macos.app.tar.gz contains $adouble AppleDouble (._*) entries — auto-update WILL fail to unpack."
            echo "::error::Re-create per docs/release-signing.md § 7a (COPYFILE_DISABLE=1 tar), re-sign § 7b, re-upload, re-run this workflow."
            tar tzf csq-desktop-macos.app.tar.gz | grep '/\._\|^\._' | head -5 | sed 's/^/::error::  /'
            exit 1
          fi
          echo "AppleDouble guard: csq-desktop-macos.app.tar.gz clean (0 ._* entries)."

          # Version-coherence backstop — fail closed on the v2.8.0-cut
          # near-miss (journal 0054). The runbook's --no-bundle=false
          # hard-error left a STALE pre-2.8.0 .app in place; the cut
          # nearly signed + shipped it under the new tag, which would
          # have made latest.json point at vN while serving vN-1 bytes.
          # release-signing.md § 1 now asserts freshness on the
          # maintainer box, but that gate is operator-skippable. This is
          # the structural backstop: the published tarball's
          # CFBundleShortVersionString MUST equal the tag version, or the
          # release does not publish. plistlib reads binary AND XML
          # plists; runner is ubuntu (no PlistBuddy).
          #
          # Extract into an isolated tmpdir (redteam R1 F11): the
          # maintainer-uploaded tarball is untrusted until the §8a gate
          # passes; a hostile tarball with absolute-path or symlink
          # entries (../etc/passwd-style attacks, /-rooted paths) could
          # pivot inside the workflow CWD if extracted in place. tar's
          # `--no-same-owner` + `--no-same-permissions` defend further;
          # we also reject any tarball with symlinks before extracting.
          EXTRACT_DIR=$(mktemp -d)
          # Trap-based cleanup so every exit path (including
          # python3 sys.exit() through set -euo pipefail) reclaims
          # the tmpdir. Pre-trap branches did `rm -rf "$EXTRACT_DIR"`
          # only on their own conditions; the python-heredoc sys.exit
          # path leaked the tmpdir (redteam R2 F5).
          trap 'rm -rf "$EXTRACT_DIR"' EXIT

          # Reject absolute-path or `..` traversal entries in the
          # tarball before extracting (redteam R1 F11, refined by
          # redteam R2 F1: scan the ENTIRE tarball, not just the
          # first 200 entries — real .app bundles have hundreds of
          # files, so head -200 made the guard structurally
          # incomplete). The wildcard extract below is the actual
          # extraction filter; this guard is the explicit defense-
          # in-depth promised by spec 14 INV-06.2.
          if tar tzf csq-desktop-macos.app.tar.gz \
               | grep -qE '(^|/)\.\.($|/)|^/' ; then
            echo "::error::csq-desktop-macos.app.tar.gz contains path-"
            echo "::error::traversal entries (absolute paths or ..)."
            echo "::error::Refusing to extract. Matching entries:"
            tar tzf csq-desktop-macos.app.tar.gz \
              | grep -E '(^|/)\.\.($|/)|^/' | head -10 \
              | sed 's/^/::error::  /'
            exit 1
          fi
          # `-C "$EXTRACT_DIR"` MUST precede the --wildcards member
          # patterns: GNU tar silently extracts ZERO files when -C
          # trails the operands (empirically reproduced with gtar
          # 0.12 against this exact tarball). With -C ahead of the
          # patterns, both Info.plist and MacOS/* land correctly.
          # (Regression from the #585 universal-binary validation;
          # first surfaced v2.14.0 — the publish runner is Linux/GNU
          # tar, so the maintainer's macOS BSD tar never exercised it.)
          tar -xzf csq-desktop-macos.app.tar.gz \
            --no-same-owner --no-same-permissions \
            -C "$EXTRACT_DIR" \
            --wildcards 'Code Squad Q.app/Contents/Info.plist' \
            --wildcards 'Code Squad Q.app/Contents/MacOS/*'
          # Post-extract assertion (redteam R1 F4): trailing-slash
          # extraction is tar-version-dependent on directory entries.
          # Confirm the files we need actually landed on disk.
          if [ ! -f "$EXTRACT_DIR/Code Squad Q.app/Contents/Info.plist" ]; then
            echo "::error::Info.plist missing after tar extract — tarball"
            echo "::error::shape is malformed or tar pattern silently"
            echo "::error::matched zero files."
            exit 1  # trap handles EXTRACT_DIR cleanup
          fi
          PLIST_VERSION=$(python3 - "$EXTRACT_DIR" <<'PY'
          import plistlib, sys
          base = sys.argv[1]
          with open(f"{base}/Code Squad Q.app/Contents/Info.plist", "rb") as f:
              print(plistlib.load(f)["CFBundleShortVersionString"])
          PY
          )
          EXPECTED_VERSION="${TAG#v}"
          if [ "$PLIST_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Version incoherence: published .app Info.plist"
            echo "::error::is v$PLIST_VERSION but tag $TAG expects"
            echo "::error::v$EXPECTED_VERSION. This is the journal 0054"
            echo "::error::stale-bundle defect reaching CI: latest.json"
            echo "::error::would point at $EXPECTED_VERSION while the"
            echo "::error::tarball serves $PLIST_VERSION bytes. Rebuild"
            echo "::error::per docs/release-signing.md § 1 (heed the"
            echo "::error::freshness gate), re-sign, re-upload, re-run."
            exit 1  # trap handles EXTRACT_DIR cleanup
          fi
          echo "Version-coherence guard: .app == tag (v$PLIST_VERSION)."

          # Universal-binary backstop — fail closed if the maintainer-
          # uploaded .app's main Mach-O lacks the x86_64 or arm64 slice.
          # The maintainer's own runbook gate (docs/release-signing.md
          # § 1 step (d)) catches this on their box, but that gate is
          # operator-skippable. This is the structural backstop on the
          # CI side. The publish job runs on ubuntu-latest (no `lipo`),
          # so we use Python's struct to parse the Mach-O fat header
          # — a fat-Mach-O begins with magic 0xCAFEBABE (BE, 32-bit
          # fat_header) or 0xCAFEBABF (BE, 64-bit fat_header) followed
          # by an nfat_arch u32, then a sequence of fat_arch[_64]
          # structs whose first field is cputype: arm64 = 0x0100000C,
          # x86_64 = 0x01000007.
          MAIN_BINARY=$(find "$EXTRACT_DIR/Code Squad Q.app/Contents/MacOS" -maxdepth 1 -type f | head -1)
          if [ -z "$MAIN_BINARY" ]; then
            echo "::error::No main binary in Code Squad Q.app/Contents/MacOS/"
            echo "::error::— the tarball's bundle structure is malformed."
            exit 1  # trap handles EXTRACT_DIR cleanup
          fi
          python3 - "$MAIN_BINARY" <<'PY'
          import struct, sys
          path = sys.argv[1]
          # Hard cap on nfat: real universal binaries have 2-4 slices
          # (typically arm64+x86_64). 16 is wildly generous; protects
          # against an attacker-controlled nfat value triggering unbounded
          # reads. (redteam R1 F10.)
          MAX_NFAT = 16
          # fat_arch (32-bit fat header magic): 20 bytes
          # fat_arch_64 (fat64 magic, 0xCAFEBABF): 32 bytes
          FAT_ARCH_SIZES = {
              0xCAFEBABE: 20,   # 32-bit fat header
              0xCAFEBABF: 32,   # 64-bit fat header (rare; tools may emit)
          }
          # Thin Mach-O magics (single-arch binary; not a fat). Listed
          # both byte orders. Detecting these vs "not a Mach-O" lets
          # the diagnostic point at the right root cause (redteam R2 F3).
          THIN_MACHO_MAGICS = {
              0xFEEDFACE,  # 32-bit Mach-O, big-endian header
              0xFEEDFACF,  # 64-bit Mach-O, big-endian header
              0xCEFAEDFE,  # 32-bit Mach-O, little-endian header
              0xCFFAEDFE,  # 64-bit Mach-O, little-endian header
          }
          # cputype constants from <mach/machine.h>. cputypes outside
          # this allowlist would let a hostile lipo-create slip arm64e
          # / i386 / ppc / arm64_32 past the gate (redteam R2 F2).
          CPU_TYPE_X86_64 = 0x01000007
          CPU_TYPE_ARM64  = 0x0100000C
          ALLOWED_CPUTYPES = {CPU_TYPE_X86_64, CPU_TYPE_ARM64}
          with open(path, "rb") as f:
              header = f.read(8)
              if len(header) < 8:
                  print(f"::error::{path} short read on fat header.")
                  sys.exit(1)
              magic = struct.unpack(">I", header[:4])[0]
              if magic in THIN_MACHO_MAGICS:
                  print(f"::error::{path} is a THIN Mach-O (magic="
                        f"0x{magic:08x}) — universal build did not"
                        f" run. The maintainer must rebuild with"
                        f" `--target universal-apple-darwin` per"
                        f" docs/release-signing.md § 1, and ensure"
                        f" `rustup target add x86_64-apple-darwin"
                        f" aarch64-apple-darwin` ran before the build.")
                  sys.exit(1)
              if magic not in FAT_ARCH_SIZES:
                  print(f"::error::{path} is NOT a Mach-O at all (magic="
                        f"0x{magic:08x}). The file shape is malformed —"
                        f" possibly a script, ELF, or corrupted archive."
                        f" The maintainer must investigate the build"
                        f" output before re-uploading.")
                  sys.exit(1)
              fat_arch_size = FAT_ARCH_SIZES[magic]
              # parse nfat_arch (big-endian on fat header)
              nfat = struct.unpack(">I", header[4:8])[0]
              if nfat == 0 or nfat > MAX_NFAT:
                  print(f"::error::{path} has nfat={nfat}, outside sane"
                        f" range [1, {MAX_NFAT}]. Likely corrupted or"
                        f" hostile Mach-O.")
                  sys.exit(1)
              cputypes = set()
              for i in range(nfat):
                  arch_struct = f.read(fat_arch_size)
                  if len(arch_struct) < fat_arch_size:
                      print(f"::error::{path} short read at arch struct"
                            f" {i}/{nfat} (got {len(arch_struct)} of"
                            f" {fat_arch_size} bytes).")
                      sys.exit(1)
                  cputype = struct.unpack(">I", arch_struct[:4])[0]
                  cputypes.add(cputype)
              if CPU_TYPE_X86_64 not in cputypes:
                  print(f"::error::{path} fat Mach-O missing x86_64 slice"
                        f" (cputypes={[hex(c) for c in cputypes]}). Intel"
                        f" Mac auto-update would fail at launch.")
                  sys.exit(1)
              if CPU_TYPE_ARM64 not in cputypes:
                  print(f"::error::{path} fat Mach-O missing arm64 slice"
                        f" (cputypes={[hex(c) for c in cputypes]}). Apple"
                        f" Silicon auto-update would fail at launch.")
                  sys.exit(1)
              # Strict cputype-set check: reject ANY non-allowlist slice
              # alongside the required two (redteam R2 F2). A fat binary
              # with arm64e, i386, ppc, or arm64_32 alongside x86_64+arm64
              # would otherwise pass this gate and only fail downstream
              # when Gatekeeper or the kernel selects the wrong slice.
              extra = cputypes - ALLOWED_CPUTYPES
              if extra:
                  print(f"::error::{path} fat Mach-O contains unexpected"
                        f" slice(s): {[hex(c) for c in sorted(extra)]}."
                        f" Spec 14 INV-06.4 requires exactly"
                        f" {{x86_64, arm64}}. Extra slices are likely a"
                        f" lipo-create regression or build-tooling drift;"
                        f" investigate before re-uploading.")
                  sys.exit(1)
              print(f"  ✓ universal-binary guard: {path} has exactly"
                    f" {{x86_64, arm64}} slices"
                    f" (cputypes={sorted(hex(c) for c in cputypes)}).")
          PY
          # EXTRACT_DIR cleanup handled by trap above.

          # Sig-encoding backstop — fail closed on the v2.7.8 double-
          # base64 defect (journal 0053). read_sig() (this workflow,
          # ~line 686) embeds the .sig into latest.json VERBATIM via
          # `cat`. A correctly-produced Tauri/minisign .sig base64-
          # decodes EXACTLY ONCE to a file beginning 'untrusted
          # comment:'. The v2.7.8 retro-fix script base64'd an already-
          # encoded .sig; the field then decoded to MORE base64 and the
          # macOS updater aborted "Invalid encoding in minisign data".
          # If a maintainer ever re-introduces that double-encode in the
          # uploaded .sig, this catches it before read_sig() bakes it in.
          decoded_head=$(base64 -d < csq-desktop-macos.app.tar.gz.sig 2>/dev/null \
            | head -c 18 || true)
          if [ "$decoded_head" != "untrusted comment:" ]; then
            echo "::error::csq-desktop-macos.app.tar.gz.sig does NOT"
            echo "::error::base64-decode once to a minisign header (got"
            echo "::error::'$decoded_head', expected 'untrusted comment:')."
            echo "::error::If it looks like more base64, the .sig is"
            echo "::error::double-encoded — the EXACT journal 0053 defect"
            echo "::error::that broke the macOS auto-updater. read_sig()"
            echo "::error::embeds .sig verbatim; it must be a raw minisign"
            echo "::error::signature, not base64(base64(sig)). Re-sign per"
            echo "::error::docs/release-signing.md § 7b and re-upload."
            exit 1
          fi
          echo "Sig-encoding guard: .sig decodes once to a minisign header."

          for f in csq-desktop-macos.dmg csq-desktop-macos.app.tar.gz; do
            shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
          done
          ls -la

      - name: Stage flattened assets
        run: |
          mkdir -p release-assets
          find staging -type f -exec cp {} release-assets/ \;
          # Build combined SHA256SUMS file. Iterate only over files
          # that HAVE a .sha256 sidecar — skip .sig files (Tauri
          # signatures aren't hashed) and sidecars themselves.
          cd release-assets
          if ls csq-* >/dev/null 2>&1; then
            for f in csq-*; do
              case "$f" in
                *.sha256|*.sig) continue ;;
              esac
              if [ -f "${f}.sha256" ]; then
                echo "$(cat "${f}.sha256")  ${f}" >> SHA256SUMS
              fi
            done
          fi
          # Remove per-file .sha256 (keep combined SHA256SUMS)
          rm -f *.sha256
          ls -la

      - name: Reject stub binaries in artifact dir (F6)
        shell: bash
        run: |
          # F6: Guard against coc-eval stub binaries accidentally ending up in
          # the release artifacts (e.g. if build-stubs.sh writes into a shared
          # target dir that also emits CLI artifacts).  Any file named
          # stub-claude, stub-codex, stub-gemini, stub-claude.exe,
          # stub-codex.exe, or stub-gemini.exe triggers a hard failure.
          cd release-assets
          found=0
          for f in stub-claude stub-codex stub-gemini \
                    stub-claude.exe stub-codex.exe stub-gemini.exe; do
            if [ -f "$f" ]; then
              echo "::error::Stub binary found in release-assets: $f — aborting release"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            exit 1
          fi
          echo "No stub binaries found in release-assets — OK"

      - name: Sign release artifacts with Foundation Ed25519 key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # Fail loudly if the secret is missing — better than
          # publishing unsigned artifacts that csq update install
          # will refuse anyway.
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret not set on this repository"
            exit 1
          fi

          SIGNER="$GITHUB_WORKSPACE/target/release/sign-release"
          if [ ! -x "$SIGNER" ]; then
            echo "::error::sign-release binary not found at $SIGNER"
            exit 1
          fi

          cd release-assets

          # Ed25519 signs CLI binaries only. Desktop installers
          # already carry a Tauri-emitted minisign `.sig` (the plugin
          # verifies that on update); per-installer Ed25519 would
          # collide on the same `.sig` filename and adds no trust —
          # SHA256SUMS below is Ed25519-signed, which is sufficient
          # Foundation attestation for out-of-band verification.
          shopt -s nullglob
          targets=(csq-linux-* csq-macos-* csq-windows-*)
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::no CLI binaries found to sign"
            exit 1
          fi

          # Filter out anything that's already a signature or checksum.
          to_sign=()
          for f in "${targets[@]}"; do
            case "$f" in
              *.sig|*.sha256) ;;
              *) [ -f "$f" ] && to_sign+=("$f") ;;
            esac
          done

          if [ ${#to_sign[@]} -eq 0 ]; then
            echo "::error::no signable artifacts after filtering"
            exit 1
          fi

          # Pass the key as the first argument; subsequent args are files.
          # The signer reads the key from argv[1] then drops it before exit.
          "$SIGNER" "$RELEASE_SIGNING_KEY" "${to_sign[@]}"

          # Verify every binary now has a corresponding .sig file.
          for f in "${to_sign[@]}"; do
            if [ ! -f "$f.sig" ]; then
              echo "::error::missing signature for $f"
              exit 1
            fi
          done

          # Sign SHA256SUMS too — `csq update install` does not currently
          # consume this signature but it lets out-of-band verifiers
          # confirm the SHA256SUMS file is Foundation-attested.
          if [ -f SHA256SUMS ]; then
            "$SIGNER" "$RELEASE_SIGNING_KEY" SHA256SUMS
          fi

          # Defense-in-depth: clear the env var even though the step
          # ends here. GitHub masks the value in logs but the unset
          # makes the intent explicit.
          unset RELEASE_SIGNING_KEY

          ls -la

      - name: Generate latest.json for tauri-plugin-updater
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          IS_STABLE: ${{ needs.tag-classify.outputs.is_stable }}
        run: |
          # tauri-plugin-updater polls an endpoint that returns a JSON
          # manifest keyed by `<os>-<arch>`; the plugin compares the
          # shipped binary version to `version` and — if newer —
          # downloads the per-platform URL, verifies the `signature`
          # (minisign format) against the pubkey baked into the app,
          # and swaps the bundle. Manifest is uploaded as
          # `latest.json` in the same release assets.
          #
          # Platforms we publish: darwin-aarch64, darwin-x86_64,
          # linux-x86_64, windows-x86_64. The two darwin keys both
          # point to the SAME universal `.app.tar.gz` — the macOS
          # bundle is built with `--target universal-apple-darwin`
          # so one fat-Mach-O artifact serves both arches. This
          # preserves the Gatekeeper "same Team ID across updates"
          # rule (same signed bundle for both arches) and avoids
          # needing a separate macos-13 (Intel) runner. See
          # workspace `intel-desktop-auto-update/journal/0001`.
          cd release-assets

          export VERSION="${TAG#v}"
          export PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export RELEASE_URL_BASE="https://github.com/terrene-foundation/csq/releases/download/${TAG}"

          # Build the manifest from platforms whose updater bundle +
          # signature are both present. On stable tags ALL four
          # expected platforms MUST be present — fail-closed so an
          # incomplete release does not silently leave a class of
          # users on the manual-download path. See workspace
          # `intel-desktop-auto-update/journal/0001` (deep-analyst
          # F5, security-reviewer F1).
          #
          # Signatures are read inside Python from the `.sig` files on
          # disk rather than passed through shell env vars (redteam R1
          # F12): multi-line minisign signatures survive an env-var
          # round-trip today but the shell→env→python serialization
          # path is latent-fragile (newline handling, special chars).
          # Reading from disk is simpler and avoids the export hop.
          python3 <<'PY' > latest.json
          import base64, json, os, pathlib, sys

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          pub_date = os.environ["PUB_DATE"]
          base = os.environ["RELEASE_URL_BASE"]
          # Normalize IS_STABLE: GH Actions step outputs sometimes carry
          # trailing whitespace or case variants ("True", "true\n"). A
          # bare `== "true"` would silently degrade fail-closed to fail-
          # open on a step-output drift (redteam R2 F4). Log the raw
          # value for forensics so a future failure has a traceable
          # signature.
          is_stable_raw = os.environ.get("IS_STABLE", "false")
          print(f"IS_STABLE seen: {is_stable_raw!r}", file=sys.stderr)
          is_stable = is_stable_raw.strip().lower() == "true"

          def read_sig(path):
              p = pathlib.Path(path)
              return p.read_text() if p.is_file() else ""

          platforms = {}
          # darwin-aarch64 + darwin-x86_64 share the SAME universal
          # tarball + sig. tauri-plugin-updater selects the key by the
          # running binary's reported arch; both keys resolve to the
          # same file on disk. (Spec 14 INV-02 — revisit if INV-02 changes.)
          sigs = {
              "darwin-aarch64": ("csq-desktop-macos.app.tar.gz",       "csq-desktop-macos.app.tar.gz.sig"),
              "darwin-x86_64":  ("csq-desktop-macos.app.tar.gz",       "csq-desktop-macos.app.tar.gz.sig"),
              "linux-x86_64":   ("csq-desktop-linux.AppImage",         "csq-desktop-linux.AppImage.sig"),
              "windows-x86_64": ("csq-desktop-windows-setup.exe",      "csq-desktop-windows-setup.exe.sig"),
          }
          for key, (filename, sig_filename) in sigs.items():
              sig = read_sig(sig_filename)
              # Sig-content guard (redteam R2 F6): a 1-byte sig file
              # (e.g., `"\n"`) is truthy but malformed. Tauri/minisign
              # `.sig` files are BASE64-encoded; the DECODED payload
              # begins with the "untrusted comment:" header (spec 14
              # INV-06.5). Validate the decoded content — consistent with
              # the sig-encoding backstop earlier in this job — NOT the raw
              # base64, which never starts with that prefix. The stored
              # `signature` stays the verbatim base64 the updater expects
              # (matches every prior release's latest.json). A raw-prefix
              # check rejected every real .sig. (Regression from #585
              # redteam R2 F6; first surfaced v2.14.0.)
              sig_stripped = sig.strip()
              try:
                  decoded_head = base64.b64decode(
                      sig_stripped, validate=True)[:18].decode("ascii", "replace")
              except Exception:
                  decoded_head = ""
              if sig and decoded_head != "untrusted comment:":
                  print(
                      f"::warning::malformed .sig for {key} "
                      f"({sig_filename!r}): does not base64-decode to a "
                      f"'untrusted comment:' minisign header. Skipping "
                      f"platform key.",
                      file=sys.stderr,
                  )
                  sig = ""  # treat as missing
              if sig and os.path.exists(filename):
                  platforms[key] = {
                      "signature": sig,
                      "url": f"{base}/{filename}",
                  }

          # Fail-closed on stable tags: every expected platform key
          # must be present. A missing key indicates a partial build
          # failure that would silently freeze that platform's users.
          if is_stable:
              expected = set(sigs.keys())
              missing = expected - set(platforms.keys())
              if missing:
                  print(
                      f"::error::latest.json missing required platform(s) on stable tag: "
                      f"{sorted(missing)}. Refusing to publish incomplete manifest.",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          manifest = {
              "version": version,
              "notes": f"csq {version} — see https://github.com/terrene-foundation/csq/releases/tag/{tag}",
              "pub_date": pub_date,
              "platforms": platforms,
          }
          print(json.dumps(manifest, indent=2))
          PY

          echo "--- generated latest.json ---"
          cat latest.json

      - name: Prune maintainer-uploaded macOS files from upload set (stable tags only)
        if: needs.tag-classify.outputs.is_stable == 'true'
        shell: bash
        run: |
          # On stable tags, the macOS .dmg / .app.tar.gz / .sig are
          # already attached to the draft release by the maintainer.
          # They were copied into release-assets/ so the SHA256SUMS and
          # latest.json steps could read them; removing them here keeps
          # the upload step from re-pushing byte-identical copies (which
          # softprops/action-gh-release@v2 would either error on or
          # silently clobber the maintainer's notarized originals).
          cd release-assets
          rm -f csq-desktop-macos.dmg \
                csq-desktop-macos.app.tar.gz \
                csq-desktop-macos.app.tar.gz.sig
          echo "Pruned. Remaining release-assets:"
          ls -la

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          fail_on_unmatched_files: true

      - name: Upsert rolling updater-manifest release
        # STABLE TAGS ONLY. The rolling `updater-manifest/latest.json`
        # is the pointer EVERY installed stable user's tauri-plugin-updater
        # polls. A prerelease (-rc/-alpha/-beta) MUST NOT move it: (1) it
        # would offer a prerelease to all stable users, and (2) on stable
        # tags the macOS bundle is Developer-ID-signed (maintainer path)
        # while prereleases use the CI ad-hoc-codesign path — Gatekeeper's
        # same-Team-ID-across-updates rule then REJECTS the auto-update at
        # launch for every Developer-ID install. Prerelease testers install
        # the versioned prerelease asset directly; they do not consume the
        # rolling manifest. Sibling "Prune maintainer-uploaded macOS files"
        # step already gates on is_stable; this step must too. Root cause +
        # incident: account-slot-decoupling journal 0051 (caught pre-impact
        # by cancelling the v2.8.0-rc.1 run before its publish job).
        if: needs.tag-classify.outputs.is_stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # tauri-plugin-updater needs a STABLE URL that returns the
          # freshest latest.json regardless of prerelease flags. GitHub's
          # /releases/latest/download/ resolves only to the release marked
          # as "Latest", and that pointer skips prereleases by default —
          # if every alpha is prerelease, the URL redirects to the
          # previous stable (or 404s on a brand-new repo).
          #
          # Fix: keep a single, non-prerelease release tagged
          # `updater-manifest` whose only asset is latest.json. The
          # workflow upserts it on every release. The plugin polls
          # `/releases/download/updater-manifest/latest.json` — stable
          # URL, always fresh, independent of the "Latest" pointer.
          #
          # Users shouldn't download from this release — it has no
          # installers. The release body explains that.
          if ! gh release view updater-manifest \
            -R ${{ github.repository }} >/dev/null 2>&1; then
            gh release create updater-manifest \
              -R ${{ github.repository }} \
              --target main \
              --title "Updater manifest (auto, do not install)" \
              --notes "Rolling latest.json for tauri-plugin-updater. Auto-updated on every release. No installers — use the versioned release tags."
          fi
          gh release upload updater-manifest \
            -R ${{ github.repository }} \
            release-assets/latest.json --clobber

      - name: Bump Homebrew tap formula (stable tags only)
        # Pushes a regenerated Formula/csq.rb to terrene-foundation/homebrew-csq
        # on every stable release, so `brew upgrade csq` tracks the latest
        # version with no manual step. Stable-only because pre-releases
        # (-rc/-alpha/-beta) MUST NOT become the default `brew install csq`
        # for the same reason they MUST NOT move the rolling updater manifest
        # (see the comment on the Upsert step above).
        #
        # Auth: FOUNDATION_PAT is the cross-repo token already used by
        # oauth-replay.yml to rotate secrets. Like that workflow, this step
        # warn-and-skips when the secret is unset rather than failing the
        # release — the tap can be bumped manually if the secret is rotated
        # out, and the release itself has already succeeded by this point.
        if: needs.tag-classify.outputs.is_stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.FOUNDATION_PAT }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::FOUNDATION_PAT not set — skipping Homebrew tap formula bump."
            echo "Release published successfully; tap formula at terrene-foundation/homebrew-csq was NOT updated."
            echo "Bump Formula/csq.rb manually, or set FOUNDATION_PAT and re-run this step."
            exit 0
          fi

          VERSION="${TAG#v}"
          SUMS=release-assets/SHA256SUMS
          if [ ! -f "$SUMS" ]; then
            echo "::error::$SUMS not found — cannot bump tap formula"
            exit 1
          fi

          # Extract one SHA per CLI artifact from the combined SHA256SUMS.
          # Format is `<sha>  <filename>` (two-space separator per shasum).
          sha_for() {
            local name="$1" sha
            sha=$(awk -v n="$name" '$2 == n {print $1}' "$SUMS")
            if [ -z "$sha" ]; then
              echo "::error::no SHA256 for $name in $SUMS"
              exit 1
            fi
            printf '%s' "$sha"
          }
          SHA_ARM=$(sha_for csq-macos-aarch64)
          SHA_INTEL=$(sha_for csq-macos-x86_64)
          SHA_LINUX=$(sha_for csq-linux-x86_64)

          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-csq.git" \
            "$workdir/tap"
          mkdir -p "$workdir/tap/Formula"

          # Heredoc is unquoted so $VERSION / $SHA_* expand, but `#{version}`
          # and `#{bin}` stay literal — bash does not treat `#{...}` as a
          # parameter expansion, and `#` inside a heredoc body is a regular
          # character (not a comment).
          cat > "$workdir/tap/Formula/csq.rb" <<RUBY
          class Csq < Formula
            desc "Multi-account rotation and quota management for Claude Code"
            homepage "https://github.com/terrene-foundation/csq"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/terrene-foundation/csq/releases/download/v#{version}/csq-macos-aarch64"
                sha256 "${SHA_ARM}"
              else
                url "https://github.com/terrene-foundation/csq/releases/download/v#{version}/csq-macos-x86_64"
                sha256 "${SHA_INTEL}"
              end
            end

            on_linux do
              url "https://github.com/terrene-foundation/csq/releases/download/v#{version}/csq-linux-x86_64"
              sha256 "${SHA_LINUX}"
            end

            def install
              # Releases ship a single bare per-arch binary (csq-macos-aarch64,
              # csq-macos-x86_64, csq-linux-x86_64). Install whichever was downloaded
              # under the canonical name \`csq\`.
              bin.install Dir["csq*"].first => "csq"
              # Homebrew's curl download does not set com.apple.quarantine, but strip it
              # defensively so a manually-fetched binary still launches without a prompt.
              quiet_system "/usr/bin/xattr", "-d", "com.apple.quarantine", bin/"csq" if OS.mac?
            end

            test do
              assert_match "csq #{version}", shell_output("#{bin}/csq --version")
            end
          end
          RUBY

          # The heredoc body above is indented 10 spaces to align with the
          # YAML run-script's column; strip that leading indent so the
          # written file has correct (2-space) Ruby indentation.
          sed -i 's/^          //' "$workdir/tap/Formula/csq.rb"

          git -C "$workdir/tap" config user.name "github-actions[bot]"
          git -C "$workdir/tap" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$workdir/tap" add Formula/csq.rb
          if git -C "$workdir/tap" diff --cached --quiet; then
            echo "Formula already at csq ${VERSION} — nothing to push."
          else
            git -C "$workdir/tap" commit -m "csq ${VERSION}"
            git -C "$workdir/tap" push origin HEAD:main
            echo "Pushed csq ${VERSION} to terrene-foundation/homebrew-csq:main"
          fi
